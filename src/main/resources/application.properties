spring.application.name=foodwaste
# Hosting platforms (Render, Railway, etc.) inject PORT. Local default is 8080.
server.port=${PORT:8080}

# Optional backend/.env file (git-ignored) supplies DB_* values; real environment variables also work.
spring.config.import=optional:file:.env[.properties]

# DB_URL must be a JDBC URL, e.g. jdbc:mysql://HOST:3306/food_wastage?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/food_wastage?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# "update" only adds missing tables/columns; it never drops data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Comma-separated browser origins. Add the deployed frontend URL in production.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.cors.allowed-origin-patterns=${CORS_ORIGIN_PATTERNS:}
